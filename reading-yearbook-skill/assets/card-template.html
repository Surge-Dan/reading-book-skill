<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
  :root{--paper:#f1eadc;--ink:#1d1c19;--muted:#6b645a;--accent:#245b59;--line:#b9ad9a}*{box-sizing:border-box}body{margin:0;background:#cbc1b0;display:grid;place-items:center;min-height:100vh;color:var(--ink);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}.card{width:900px;height:1200px;background:var(--paper);padding:72px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(94deg,transparent 0 5px,rgba(50,35,18,.14) 6px 7px)}.meta{font:12px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--accent);border-bottom:1px solid var(--ink);padding-bottom:16px}.title{font:500 68px/1.02 "Iowan Old Style","Songti SC","STSong",serif;margin:48px 0 12px;max-width:9em}.author{color:var(--muted)}.thread{position:absolute;background:var(--accent)}.label{font-size:13px;color:var(--accent);letter-spacing:.08em}.copy{font:24px/1.75 "Songti SC","STSong",serif}.foot{position:absolute;bottom:45px;left:72px;right:72px;border-top:1px solid var(--line);padding-top:14px;font:11px ui-monospace,monospace;color:var(--muted);display:flex;justify-content:space-between}
